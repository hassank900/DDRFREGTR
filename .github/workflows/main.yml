name: windows-runner-recon

on:
  workflow_dispatch:
    inputs:
      heartbeat_minutes:
        description: 'How long the telemetry heartbeat loop keeps the job alive'
        required: false
        default: '10'
      heartbeat_seconds:
        description: 'Seconds between heartbeat samples'
        required: false
        default: '30'

concurrency:
  group: recon-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: 'C:\'

env:
  TELEMETRY_ROOT: 'C:\telemetry'
  HEARTBEAT_MINUTES: ${{ github.event.inputs.heartbeat_minutes || '10' }}
  HEARTBEAT_SECONDS: ${{ github.event.inputs.heartbeat_seconds || '30' }}
  LIB_B64: ''
  LIB_CODE: ''

jobs:
  recon:
    name: Windows Server 2025 runner deep reconnaissance
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Initialize telemetry workspace and shared probe library
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch { }
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'canaries') | Out-Null
          $decoded = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64))
          $libPath = Join-Path $root 'lib.ps1'
          [System.IO.File]::WriteAllText($libPath, $decoded, (New-Object System.Text.UTF8Encoding($false)))
          "TELEMETRY_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          . $libPath
          Write-Host ('LIB_BYTES=' + (Get-Item -LiteralPath $libPath).Length)
          Write-Host ('LIB_FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('TELEMETRY_ROOT_RESOLVED=' + $root)
          Write-Host ('HOST=' + $env:COMPUTERNAME + ' PID=' + $PID + ' USER=' + $env:USERNAME + ' PS=' + $PSVersionTable.PSVersion)
          Write-Host ('GITHUB_RUN_ID=' + $env:GITHUB_RUN_ID + ' JOB=' + $env:GITHUB_JOB + ' WORKFLOW=' + $env:GITHUB_WORKFLOW)
          Write-Host ('RUNNER_NAME=' + $env:RUNNER_NAME + ' RUNNER_OS=' + $env:RUNNER_OS + ' RUNNER_ARCH=' + $env:RUNNER_ARCH + ' RUNNER_IMAGE=' + $env:ImageOS)
          Write-Host ('STARTED_UTC=' + (Get-Date).ToUniversalTime().ToString('o'))

      - name: Verify the probe library mirror against the primary payload
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false) } catch { }
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          $primary = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64))
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $primaryHash = -join ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($primary)) | ForEach-Object { $_.ToString('x2') })
          Write-Host ('LIB_PRIMARY_BYTES=' + $primary.Length + ' LIB_PRIMARY_SHA256=' + $primaryHash)
          $code = $env:LIB_CODE
          Write-Host ('LIB_CODE_B64_LENGTH=' + $code.Length)
          $decoded = ''
          $inflateError = ''
          $zipBuffer = [Convert]::FromBase64String($code)
          try {
              $input = New-Object System.IO.MemoryStream(, $zipBuffer)
              $output = New-Object System.IO.MemoryStream
              $inflate = New-Object System.IO.Compression.ZLibStream($input, [System.IO.Compression.CompressionMode]::Decompress)
              $inflate.CopyTo($output)
              $inflate.Dispose()
              $decoded = [System.Text.Encoding]::UTF8.GetString($output.ToArray())
              $output.Dispose()
              $input.Dispose()
          }
          catch {
              $inflateError = $_.Exception.Message
              if ($inflate) { try { $inflate.Dispose() } catch { } }
          }
          if ($decoded.Length -eq 0) {
              Write-Host 'LIB_INFLATE_FALLBACK=raw-base64'
              $decoded = $primary
          }
          $mirrorBytes = [System.Text.Encoding]::UTF8.GetBytes($decoded)
          $mirrorHash = -join ($sha.ComputeHash($mirrorBytes) | ForEach-Object { $_.ToString('x2') })
          Write-Host ('LIB_MIRROR_BYTES=' + $mirrorBytes.Length + ' LIB_MIRROR_SHA256=' + $mirrorHash)
          Write-Host ('LIB_INFLATE_ERROR=' + $inflateError)
          Write-Host ('LIB_MIRROR_MATCHES_PRIMARY=' + [bool]($mirrorHash -eq $primaryHash))
          if ($mirrorHash -ne $primaryHash) { $decoded = $primary }
          [System.IO.File]::WriteAllText($libPath, $decoded, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host ('LIB_MATERIALISED=' + $libPath + ' BYTES=' + (Get-Item -LiteralPath $libPath).Length + ' SHA256=' + (Get-FileHash -LiteralPath $libPath -Algorithm SHA256).Hash)
          . $libPath
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($libPath, [ref]$tokens, [ref]$errors)
          Write-Host ('LIB_PARSE_ERRORS=' + $errors.Count)
          foreach ($parseError in $errors) { Write-Host ('LIB_PARSE_DETAIL ' + $parseError.Extent.StartLineNumber + ':' + $parseError.Extent.StartColumnNumber + ' ' + $parseError.Message) }
          $probeFunctions = foreach ($fn in 'Save-Probe', 'Invoke-Captured', 'Show-Captured', 'Format-ExceptionDeep', 'Get-ProcessOwnerMap', 'Get-ListenerSnapshot') {
              if (Get-Command -Name $fn -ErrorAction SilentlyContinue) { $fn }
          }
          Write-Host ('LIB_FUNCTIONS=' + ($probeFunctions -join ','))
          Write-Host ('LIB_READY=' + [bool]($probeFunctions.Count -eq 6))

      - name: Token, identity and session isolation telemetry
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'identity' {
              Write-Host '--- whoami /user /groups /priv ---'
              whoami /user
              whoami /groups
              whoami /priv
              Write-Host '--- managed identity claims ---'
              $id = [Security.Principal.WindowsIdentity]::GetCurrent()
              Write-Host ('Name=' + $id.Name + ' AuthType=' + $id.AuthenticationType + ' ImpersonationLevel=' + $id.ImpersonationLevel + ' IsSystem=' + $id.IsSystem + ' Token=' + $id.Token)
              foreach ($claim in $id.Claims) { Write-Host ('CLAIM ' + $claim.Type + ' = ' + $claim.Value) }
              $principal = New-Object Security.Principal.WindowsPrincipal($id)
              Write-Host ('IsAdmin=' + $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
              Write-Host ('IsSystemRole=' + $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::System))
              Write-Host '--- process session ---'
              Get-Process -Id $PID | Select-Object Id, ProcessName, SessionId, StartTime, Path, @{n = 'WS_MB'; e = { [int]($_.WorkingSet64 / 1MB) } } | Format-List
              Write-Host '--- interactive session table ---'
              qwinsta
              quser 2>&1
              Write-Host '--- logon sessions ---'
              Get-CimInstance Win32_LogonSession | Select-Object LogonId, LogonType, StartTime, AuthenticationPackage | Sort-Object LogonType | Format-Table -AutoSize
              Get-CimInstance Win32_LoggedOnUser | Select-Object Antecedent, Dependent | Format-Table -AutoSize
              Write-Host '--- computer system identity ---'
              Get-CimInstance Win32_ComputerSystem | Select-Object Name, Domain, UserName, Manufacturer, Model, NumberOfLogicalProcessors, TotalPhysicalMemory | Format-List
              Write-Host '--- parent process chain ---'
              $current = [int]$PID
              for ($i = 0; $i -lt 6; $i++) {
                  $proc = Get-CimInstance Win32_Process -Filter ("ProcessId=$current") -ErrorAction SilentlyContinue
                  if (-not $proc) { break }
                  $ownerName = 'UNKNOWN'
                  try { $o = Invoke-CimMethod -InputObject $proc -MethodName GetOwner; $ownerName = ('{0}\{1}' -f $o.Domain, $o.User) } catch { }
                  Write-Host ('CHAIN[{0}] pid={1} name={2} owner={3} session={4} created={5} cmd={6}' -f $i, $proc.ProcessId, $proc.Name, $ownerName, $proc.SessionId, $proc.CreationDate, $proc.CommandLine)
                  if (-not $proc.ParentProcessId) { break }
                  $current = [int]$proc.ParentProcessId
              }
              Write-Host '--- session-separated process groups ---'
              Get-CimInstance Win32_Process | Group-Object SessionId | Sort-Object Name | Select-Object Name, Count | Format-Table -AutoSize
          }

      - name: Full process table with owners, sessions and command lines
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'processes' {
              $ownerMap = Get-ProcessOwnerMap -Limit 500
              $rows = Get-CimInstance Win32_Process | ForEach-Object {
                  [pscustomobject]@{
                      Pid = $_.ProcessId
                      ParentPid = $_.ParentProcessId
                      Name = $_.Name
                      SessionId = $_.SessionId
                      Owner = if ($ownerMap.ContainsKey([int]$_.ProcessId)) { $ownerMap[[int]$_.ProcessId] } else { 'UNMAPPED' }
                      MemoryMB = if ($_.WorkingSetSize) { [int]($_.WorkingSetSize / 1MB) } else { 0 }
                      Threads = $_.ThreadCount
                      CommandLine = $_.CommandLine
                  }
              } | Sort-Object Name
              Write-Host ('PROCESS_COUNT=' + $rows.Count)
              $rows | Format-Table -AutoSize -Wrap
              $csvPath = Join-Path $env:TELEMETRY_ROOT 'processes.csv'
              $rows | Export-Csv -LiteralPath $csvPath -NoTypeInformation -Encoding utf8
              Write-Host ('CSV=' + $csvPath + ' bytes=' + (Get-Item -LiteralPath $csvPath).Length)
              Write-Host '--- binaries of interest ---'
              foreach ($name in 'tvnserver', 'winvnc', 'vncserver', 'cloudflared', 'python', 'python3', 'websockify', 'choco', 'Runner.Listener', 'Runner.Worker', 'explorer', 'dwm', 'winlogon', 'LogonUI', 'csrss', 'lsass') {
                  $found = Get-Process -Name $name -ErrorAction SilentlyContinue
                  if ($found) { $found | Select-Object Id, ProcessName, SessionId, Path, StartTime | Format-Table -AutoSize }
                  else { Write-Host ('NOT_RUNNING ' + $name) }
              }
              Write-Host '--- top consumers ---'
              Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 15 Name, Id, SessionId, @{n = 'MB'; e = { [int]($_.WorkingSet64 / 1MB) } }, @{n = 'CPU'; e = { [math]::Round($_.CPU, 1) } } | Format-Table -AutoSize
              Write-Host '--- startup WMI deltas ---'
              Get-CimInstance Win32_OperatingSystem | Select-Object LastBootUpTime, LocalDateTime, TotalVisibleMemorySize, FreePhysicalMemory | Format-List
          }

      - name: Service, driver and scheduled-task inventory
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'services' {
              Write-Host ('SERVICE_COUNT=' + (Get-Service).Count)
              Get-CimInstance Win32_Service | Select-Object Name, DisplayName, State, StartMode, StartName, ProcessId, PathName | Sort-Object State, Name | Format-Table -AutoSize -Wrap
              Write-Host '--- running drivers ---'
              Get-CimInstance Win32_SystemDriver | Where-Object { $_.State -eq 'Running' } | Select-Object Name, State, StartMode, PathName | Format-Table -AutoSize -Wrap
              Write-Host '--- service control queries ---'
              foreach ($svc in 'tvnserver', 'Cloudflared', 'TermService', 'SessionEnv', 'UmRdpService', 'WinRM', 'EventLog', 'Schedule') {
                  Write-Host ('### sc query ' + $svc)
                  $q = Invoke-Captured -FilePath 'C:\Windows\System32\sc.exe' -Arguments @('query', $svc) -TimeoutSeconds 20
                  Show-Captured $q
                  Write-Host ('### sc qc ' + $svc)
                  $qc = Invoke-Captured -FilePath 'C:\Windows\System32\sc.exe' -Arguments @('qc', $svc) -TimeoutSeconds 20
                  Show-Captured $qc
              }
          }
          Save-Probe 'scheduled_tasks' {
              $tasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue)
              Write-Host ('TASK_COUNT=' + $tasks.Count)
              foreach ($t in $tasks) {
                  $info = $null
                  try { $info = $t | Get-ScheduledTaskInfo -ErrorAction SilentlyContinue } catch { }
                  $principal = $t.Principal
                  $userId = ''
                  $logonType = ''
                  $runLevel = ''
                  if ($principal) {
                      $userId = [string]$principal.UserId
                      $logonType = [string]$principal.LogonType
                      $runLevel = [string]$principal.RunLevel
                  }
                  $lastRun = ''
                  $lastResult = ''
                  if ($info) {
                      $lastRun = [string]$info.LastRunTime
                      $lastResult = [string]$info.LastTaskResult
                  }
                  $taskPath = [string]$t.TaskPath + [string]$t.TaskName
                  Write-Host ('TASK path=' + $taskPath + ' state=' + [string]$t.State + ' user=' + $userId + ' logon=' + $logonType + ' runlevel=' + $runLevel + ' lastRun=' + $lastRun + ' lastResult=' + $lastResult)
              }
              Write-Host '--- tasks referencing telemetry, VNC, desktop or tunnel markers ---'
              $tasks | Where-Object { $_.TaskName -like 'Telemetry*' -or $_.TaskName -like '*VNC*' -or $_.TaskName -like '*Desktop*' -or $_.TaskName -like '*Tunnel*' -or $_.TaskName -like '*cloudflare*' } | ForEach-Object { Write-Host ('TASK_MATCH ' + $_.TaskPath + $_.TaskName + ' state=' + [string]$_.State) }
          }

      - name: Filesystem inventory for VNC, Chocolatey, Python and tool caches
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'filesystem' {
              $targets = @(
                  'C:\Program Files\TightVNC',
                  'C:\Program Files (x86)\TightVNC',
                  'C:\Program Files\TigerVNC',
                  'C:\ProgramData\TightVNC',
                  'C:\ProgramData\chocolatey',
                  'C:\ProgramData\chocolatey\bin',
                  'C:\ProgramData\chocolatey\lib',
                  'C:\hostedtoolcache\windows\Python',
                  'C:\hostedtoolcache\windows\node',
                  'C:\novnc',
                  'C:\ProgramData\cloudflared',
                  'C:\cloudflared-amd64.exe',
                  'C:\telemetry'
              )
              foreach ($path in $targets) {
                  if (Test-Path -LiteralPath $path) {
                      $item = Get-Item -LiteralPath $path
                      Write-Host ('EXISTS {0} mode={1} attributes={2} created={3} modified={4}' -f $path, $(if ($item.PSIsContainer) { 'DIR' } else { 'FILE' }), $item.Attributes, $item.CreationTimeUtc, $item.LastWriteTimeUtc)
                      if ($item.PSIsContainer) {
                          Get-ChildItem -LiteralPath $path -Force -ErrorAction SilentlyContinue | Select-Object -First 40 Name, Length, LastWriteTimeUtc, Attributes | Format-Table -AutoSize
                      }
                      else {
                          Write-Host ('  size={0} sha256={1} version={2}' -f $item.Length, (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash, $item.VersionInfo.FileVersion)
                      }
                  }
                  else {
                      Write-Host ('MISSING ' + $path)
                  }
              }
              Write-Host '--- every python interpreter under the tool cache ---'
              $interpreters = Get-ChildItem 'C:\hostedtoolcache\windows\Python' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                  $exe = Join-Path $_.FullName 'x64\python.exe'
                  if (Test-Path -LiteralPath $exe) { $exe }
              }
              foreach ($exe in $interpreters) {
                  $ver = Invoke-Captured -FilePath $exe -Arguments @('-c', 'import sys; print(sys.version)') -TimeoutSeconds 30
                  Show-Captured $ver
                  $pkgs = Invoke-Captured -FilePath $exe -Arguments @('-c', 'import importlib.util as u; print({n: bool(u.find_spec(n)) for n in ["mss","PIL","websockify","Crypto","pyDes"]})') -TimeoutSeconds 30
                  Show-Captured $pkgs
                  Write-Host ('INTERPRETER_SHA256=' + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash)
              }
              Write-Host '--- recursive search for VNC server binaries ---'
              $ProgressPreference = 'SilentlyContinue'
              $vncNames = @('tvnserver.exe', 'winvnc.exe', 'winvnc4.exe', 'vncserver.exe', 'tvnviewer.exe', 'vncviewer.exe')
              foreach ($searchRoot in 'C:\\Program Files', 'C:\\Program Files (x86)', 'C:\\ProgramData') {
                  Write-Host ('VNC_SEARCH_ROOT=' + $searchRoot)
                  $hits = @()
                  try {
                      $hits = @(Get-ChildItem -LiteralPath $searchRoot -Recurse -Force -File -ErrorAction SilentlyContinue | Where-Object { $vncNames -contains $_.Name.ToLowerInvariant() })
                  }
                  catch { Write-Host ('VNC_SEARCH_ERROR ' + (Format-ExceptionDeep $_)) }
                  Write-Host ('VNC_SEARCH_HITS=' + $hits.Count)
                  foreach ($hit in ($hits | Select-Object -First 20)) { Write-Host ('VNC_HIT ' + $hit.FullName + ' bytes=' + $hit.Length) }
              }
              Write-Host '--- disk space ---'
              Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n = 'UsedGB'; e = { [int]($_.Used / 1GB) } }, @{n = 'FreeGB'; e = { [int]($_.Free / 1GB) } }, Root | Format-Table -AutoSize
          }

      - name: Registry inventory for TightVNC, Chocolatey, Python and process policy
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          function Dump-RegistryTree {
              param([string]$Path)
              if (-not (Test-Path -LiteralPath $Path)) { Write-Host ('REG_MISSING ' + $Path); return }
              Write-Host ('REG_TREE ' + $Path)
              try {
                  $item = Get-Item -LiteralPath $Path -ErrorAction Stop
                  foreach ($name in $item.GetValueNames()) {
                      $value = $null
                      try { $value = $item.GetValue($name, $null, 'DoNotExpandEnvironmentNames') } catch { }
                      $kind = 'UNKNOWN'
                      try { $kind = $item.GetValueKind($name).ToString() } catch { }
                      $rendered = if ($value -is [byte[]]) { 'hex:' + (($value | ForEach-Object { $_.ToString('x2') }) -join '') } else { [string]$value }
                      Write-Host ('  VALUE {0} type={1} data={2}' -f $name, $kind, $rendered)
                  }
                  foreach ($sub in $item.GetSubKeyNames()) {
                      $child = Join-Path $Path $sub
                      Write-Host ('  SUBKEY ' + $child)
                      try {
                          $childItem = Get-Item -LiteralPath $child -ErrorAction Stop
                          foreach ($name in $childItem.GetValueNames()) {
                              $value = $null
                              try { $value = $childItem.GetValue($name, $null, 'DoNotExpandEnvironmentNames') } catch { }
                              $rendered = if ($value -is [byte[]]) { 'hex:' + (($value | ForEach-Object { $_.ToString('x2') }) -join '') } else { [string]$value }
                              Write-Host ('    VALUE {0} data={1}' -f $name, $rendered)
                          }
                      }
                      catch { Write-Host ('    SUBKEY_ERROR ' + $_.Exception.Message) }
                  }
              }
              catch { Write-Host ('REG_ERROR {0} :: {1}' -f $Path, $_.Exception.Message) }
          }
          Save-Probe 'registry' {
              foreach ($path in @(
                  'HKLM:\SOFTWARE\TightVNC',
                  'HKLM:\SOFTWARE\TightVNC\Server',
                  'HKLM:\SOFTWARE\WOW6432Node\TightVNC',
                  'HKLM:\SOFTWARE\WOW6432Node\TightVNC\Server',
                  'HKCU:\SOFTWARE\TightVNC',
                  'HKCU:\SOFTWARE\TightVNC\Server',
                  'HKLM:\SOFTWARE\GlavSoft',
                  'HKLM:\SOFTWARE\ORL',
                  'HKLM:\SOFTWARE\RealVNC',
                  'HKLM:\SOFTWARE\TigerVNC'
              )) { Dump-RegistryTree $path }
              Write-Host '--- installed packages / uninstall entries mentioning VNC ---'
              foreach ($root in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
                  Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue | ForEach-Object {
                      $props = Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue
                      if ($props.DisplayName -match 'VNC|Tight|Tiger|RealVNC|Ultra') {
                          Write-Host ('PKG {0} | {1} | {2} | {3}' -f $props.DisplayName, $props.DisplayVersion, $props.InstallLocation, $_.PSPath)
                      }
                  }
              }
              Write-Host '--- chocolatey environment ---'
              Dump-RegistryTree 'HKLM:\SOFTWARE\Chocolatey'
              Dump-RegistryTree 'HKLM:\SOFTWARE\WOW6432Node\Chocolatey'
              Get-ChildItem Env: | Where-Object { $_.Name -match 'CHOCO' } | Format-Table -AutoSize
              Write-Host '--- python registration ---'
              Dump-RegistryTree 'HKLM:\SOFTWARE\Python'
              Dump-RegistryTree 'HKCU:\SOFTWARE\Python'
              Write-Host '--- run keys, policies and terminal services ---'
              Dump-RegistryTree 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
              Dump-RegistryTree 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
              Dump-RegistryTree 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
              Dump-RegistryTree 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Terminal Services'
              Dump-RegistryTree 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
              Write-Host '--- filesystem redirection state ---'
              Write-Host ('WOW64_current=' + [System.Environment]::Is64BitProcess + ' os64=' + [System.Environment]::Is64BitOperatingSystem)
              Invoke-Captured -FilePath 'C:\Windows\System32\reg.exe' -Arguments @('query', 'HKLM\SOFTWARE\TightVNC\Server', '/s') -TimeoutSeconds 20 | ForEach-Object { Show-Captured $_ }
          }

      - name: Environment variables, PATH resolution and interpreter selection
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'environment' {
              Write-Host '--- process environment ---'
              Get-ChildItem Env: | Sort-Object Name | Format-Table -AutoSize -Wrap
              Write-Host '--- machine and user scoped environment ---'
              [Environment]::GetEnvironmentVariables('Machine').GetEnumerator() | Sort-Object Name | Format-Table -AutoSize -Wrap
              [Environment]::GetEnvironmentVariables('User').GetEnumerator() | Sort-Object Name | Format-Table -AutoSize -Wrap
              Write-Host '--- PATH entry validation ---'
              foreach ($entry in ($env:PATH -split ';')) {
                  if (-not $entry) { continue }
                  $state = if (Test-Path -LiteralPath $entry) { 'EXISTS ' } else { 'MISSING' }
                  Write-Host ('{0} {1}' -f $state, $entry)
              }
              Write-Host '--- tool resolution ---'
              foreach ($tool in 'python.exe', 'python3.exe', 'pip.exe', 'choco.exe', 'cloudflared.exe', 'tvnserver.exe', 'reg.exe', 'sc.exe', 'netsh.exe', 'schtasks.exe', 'curl.exe', 'tar.exe', 'pwsh.exe', 'powershell.exe', 'node.exe', 'git.exe') {
                  $where = Invoke-Captured -FilePath 'C:\Windows\System32\where.exe' -Arguments @($tool) -TimeoutSeconds 20
                  Write-Host ('WHERE ' + $tool)
                  if ($where.Stdout) { Write-Host $where.Stdout.Trim() }
                  if ($where.ExitCode -ne 0) { Write-Host ('  NOT_FOUND exit=' + $where.ExitCode) }
              }
              Write-Host '--- interpreter candidates evaluated in order ---'
              $candidates = @()
              $candidates += (Get-ChildItem 'C:\hostedtoolcache\windows\Python' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\python.exe' })
              $candidates += 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
              $candidates += 'C:\Program Files\Python312\python.exe'
              $candidates += 'C:\Program Files\Python311\python.exe'
              foreach ($candidate in $candidates) {
                  $state = if (Test-Path -LiteralPath $candidate) { 'EXISTS ' } else { 'MISSING' }
                  Write-Host ('{0} {1}' -f $state, $candidate)
              }
              Write-Host '--- powershell host details ---'
              $PSVersionTable | Format-List
              Write-Host ('PS_EXE=' + [Diagnostics.Process]::GetCurrentProcess().Path)
              Write-Host ('PS_HOME=' + $PSHOME)
              (Get-Module -ListAvailable | Select-Object -First 30 Name, Version, Path) | Format-Table -AutoSize
              Write-Host '--- locale and code page ---'
              Get-Culture | Format-List
              chcp
          }

      - name: Network bindings, listeners, firewall state and loopback reachability
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'network' {
              Write-Host '--- adapters ---'
              Get-NetAdapter -ErrorAction SilentlyContinue | Select-Object Name, InterfaceDescription, Status, MacAddress, LinkSpeed, ifIndex | Format-Table -AutoSize -Wrap
              Write-Host '--- addresses ---'
              Get-NetIPAddress -ErrorAction SilentlyContinue | Select-Object InterfaceAlias, AddressFamily, IPAddress, PrefixLength, PrefixOrigin, SuffixOrigin | Sort-Object InterfaceAlias | Format-Table -AutoSize
              Write-Host '--- routes ---'
              Get-NetRoute -ErrorAction SilentlyContinue | Select-Object -First 30 DestinationPrefix, NextHop, InterfaceAlias, RouteMetric | Format-Table -AutoSize
              Write-Host '--- dns ---'
              Get-DnsClientServerAddress -ErrorAction SilentlyContinue | Select-Object InterfaceAlias, AddressFamily, ServerAddresses | Format-Table -AutoSize
              Write-Host '--- full listener table ---'
              $listeners = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue
              Write-Host ('LISTENER_COUNT=' + $listeners.Count)
              $listeners | Select-Object LocalAddress, LocalPort, OwningProcess, @{n = 'Process'; e = { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName } } | Sort-Object LocalPort | Format-Table -AutoSize
              Write-Host '--- ports of interest ---'
              Get-ListenerSnapshot -Ports @(5900, 5901, 6080, 6081, 3389, 22, 445) | Format-Table -AutoSize
              Write-Host '--- netstat raw ---'
              $netstat = Invoke-Captured -FilePath 'C:\Windows\System32\netstat.exe' -Arguments @('-ano') -TimeoutSeconds 30
              if ($netstat.Stdout) { Write-Host $netstat.Stdout }
              Show-Captured $netstat
              Write-Host '--- reserved and dynamic port ranges ---'
              Invoke-Captured -FilePath 'C:\Windows\System32\netsh.exe' -Arguments @('interface', 'ipv4', 'show', 'excludedportrange', 'protocol=tcp') -TimeoutSeconds 20 | ForEach-Object { Show-Captured $_ }
              Invoke-Captured -FilePath 'C:\Windows\System32\netsh.exe' -Arguments @('int', 'ipv4', 'show', 'dynamicport', 'tcp') -TimeoutSeconds 20 | ForEach-Object { Show-Captured $_ }
              Write-Host '--- firewall profiles ---'
              Get-NetFirewallProfile -ErrorAction SilentlyContinue | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction, LogBlocked, AllowInboundRules | Format-Table -AutoSize
              Write-Host '--- firewall rules touching the interesting ports ---'
              Get-NetFirewallPortFilter -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -match '5900|5901|6080|6081|3389' } | ForEach-Object {
                  $rule = $_ | Get-NetFirewallRule -ErrorAction SilentlyContinue
                  if ($rule) { Write-Host ('RULE {0} direction={1} action={2} enabled={3} profile={4} port={5}' -f $rule.DisplayName, $rule.Direction, $rule.Action, $rule.Enabled, $rule.Profile, $_.LocalPort) }
              }
              Write-Host '--- loopback reachability ---'
              foreach ($port in 5900, 6080, 6081, 3389) {
                  $probe = Test-NetConnection -ComputerName '127.0.0.1' -Port $port -InformationLevel Detailed -WarningAction SilentlyContinue -ErrorAction SilentlyContinue
                  Write-Host ('LOOPBACK port={0} tcp={1} source={2} interface={3}' -f $port, $probe.TcpTestSucceeded, $probe.SourceAddress, $probe.InterfaceAlias)
              }
              Write-Host '--- outbound reachability ---'
              foreach ($target in @(@('1.1.1.1', 443), @('github.com', 443), @('region1.v2.argotunnel.com', 7844))) {
                  $probe = Test-NetConnection -ComputerName $target[0] -Port $target[1] -InformationLevel Quiet -WarningAction SilentlyContinue -ErrorAction SilentlyContinue
                  Write-Host ('OUTBOUND host={0} port={1} tcp={2}' -f $target[0], $target[1], $probe)
              }
              Write-Host '--- DNS resolution ---'
              foreach ($name in 'github.com', 'www.python.org', 'api.trycloudflare.com', 'region1.v2.argotunnel.com') {
                  try { Resolve-DnsName -Name $name -ErrorAction Stop | Select-Object -First 4 Name, Type, IPAddress | Format-Table -AutoSize } catch { Write-Host ('DNS_ERROR ' + $name + ' :: ' + $_.Exception.Message) }
              }
              Write-Host '--- proxy configuration ---'
              Get-ChildItem Env: | Where-Object { $_.Name -match 'PROXY|proxy' } | Format-Table -AutoSize
          }

      - name: Permissions, ACL and privilege audit
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'permissions' {
              Write-Host '--- acl snapshots ---'
              foreach ($path in 'C:\', 'C:\Program Files', 'C:\ProgramData', 'C:\Windows\System32', 'C:\Windows\Temp', 'C:\hostedtoolcache', 'C:\ProgramData\chocolatey', 'C:\Users\runneradmin', 'C:\telemetry') {
                  if (-not (Test-Path -LiteralPath $path)) { Write-Host ('MISSING ' + $path); continue }
                  Write-Host ('ACL ' + $path)
                  try {
                      $acl = Get-Acl -LiteralPath $path
                      Write-Host ('  owner=' + $acl.Owner + ' group=' + $acl.Group)
                      $acl.Access | ForEach-Object { Write-Host ('  ACE {0} rights={1} inherit={2} propagate={3}' -f $_.IdentityReference, $_.FileSystemRights, $_.InheritanceFlags, $_.PropagationFlags) }
                  }
                  catch { Write-Host ('  ACL_ERROR ' + (Format-ExceptionDeep $_)) }
                  $icacls = Invoke-Captured -FilePath 'C:\Windows\System32\icacls.exe' -Arguments @($path) -TimeoutSeconds 30
                  Show-Captured $icacls
              }
              Write-Host '--- write/delete capability tests ---'
              foreach ($dir in 'C:\telemetry', 'C:\ProgramData', 'C:\Windows\Temp', 'C:\Users\runneradmin\AppData\Local\Temp', 'C:\Program Files') {
                  $file = Join-Path $dir ('probe_' + [guid]::NewGuid().ToString('N') + '.tmp')
                  $created = $false
                  $deleted = $false
                  try {
                      [System.IO.File]::WriteAllText($file, 'probe')
                      $created = Test-Path -LiteralPath $file
                      Remove-Item -LiteralPath $file -Force -ErrorAction Stop
                      $deleted = $true
                  }
                  catch { Write-Host ('WRITE_TEST_ERROR {0} :: {1}' -f $dir, (Format-ExceptionDeep $_)) }
                  Write-Host ('WRITE_TEST dir={0} created={1} deleted={2}' -f $dir, $created, $deleted)
              }
              Write-Host '--- effective privileges and token groups ---'
              $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
              Write-Host ('IMPERSONATION=' + $identity.ImpersonationLevel + ' SYSTEM=' + $identity.IsSystem)
              whoami /priv
              whoami /groups
              Write-Host '--- debug privilege capability test (open protected process) ---'
              try {
                  $target = Get-Process -Id 4 -ErrorAction Stop
                  Write-Host ('CAN_QUERY_SYSTEM_PROCESS handle=' + $target.Handle + ' name=' + $target.ProcessName)
                  try {
                      $mods = $target.Modules.Count
                      Write-Host ('SYSTEM_PROCESS_MODULES=' + $mods)
                  }
                  catch { Write-Host ('SYSTEM_PROCESS_MODULES_DENIED ' + (Format-ExceptionDeep $_)) }
              }
              catch { Write-Host ('SYSTEM_PROCESS_DENIED ' + (Format-ExceptionDeep $_)) }
              Write-Host '--- audit policy ---'
              $audit = Invoke-Captured -FilePath 'C:\Windows\System32\auditpol.exe' -Arguments @('/get', '/category:*') -TimeoutSeconds 30
              Show-Captured $audit
              Write-Host '--- integrity level of the current process ---'
              $whoamiGroups = (whoami /groups) -join "`r`n"
              if ($whoamiGroups -match 'Mandatory Label\\(\S+)') { Write-Host ('INTEGRITY=' + $Matches[1]) }
          }

      - name: Execution canary harness and exception-trace fidelity
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'canaries' {
              $canaryDir = Join-Path $env:TELEMETRY_ROOT 'canaries'
              New-Item -ItemType Directory -Force -Path $canaryDir | Out-Null
              Write-Host '--- trivial child process ---'
              Show-Captured (Invoke-Captured -FilePath 'C:\Windows\System32\cmd.exe' -Arguments @('/c', 'echo canary-alive && whoami && echo %SESSIONNAME%') -TimeoutSeconds 30)
              Write-Host '--- child powershell with session introspection ---'
              Show-Captured (Invoke-Captured -FilePath 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -Arguments @('-NoProfile', '-Command', '(Get-Process -Id $PID).SessionId; [Security.Principal.WindowsIdentity]::GetCurrent().Name; (New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole("Administrator")') -TimeoutSeconds 45)
              Write-Host '--- stderr capture fidelity (python) ---'
              $python = (@(Get-ChildItem 'C:\hostedtoolcache\windows\Python' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\python.exe' }) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1)
              if ($python) {
                  Show-Captured (Invoke-Captured -FilePath $python -Arguments @('-c', 'import sys; sys.stderr.write("STDERR_CANARY\\n"); raise RuntimeError("STDOUT_CANARY_RAISED")') -TimeoutSeconds 45)
                  Show-Captured (Invoke-Captured -FilePath $python -Arguments @('-c', 'import importlib.util as u; print({n: bool(u.find_spec(n)) for n in ["mss","PIL","websockify","Crypto","pyDes","pywin32","win32api"]})') -TimeoutSeconds 45)
              }
              else { Write-Host 'NO_PYTHON_FOUND' }
              Write-Host '--- detached background process inheritance ---'
              try {
                  $detached = Start-Process -FilePath 'C:\Windows\System32\cmd.exe' -ArgumentList '/c', ('ping -n 6 127.0.0.1 > "' + (Join-Path $canaryDir 'detached.txt') + '" && whoami >> "' + (Join-Path $canaryDir 'detached.txt') + '"') -WindowStyle Hidden -PassThru -ErrorAction Stop
                  Write-Host ('DETACHED pid=' + $detached.Id + ' session=' + $detached.SessionId)
                  $detached.WaitForExit(20000) | Out-Null
                  Write-Host ('DETACHED_EXITED=' + $detached.HasExited)
                  if (Test-Path -LiteralPath (Join-Path $canaryDir 'detached.txt')) { Get-Content -LiteralPath (Join-Path $canaryDir 'detached.txt') | ForEach-Object { Write-Host ('DETACHED_OUT ' + $_) } }
              }
              catch { Write-Host ('DETACHED_ERROR ' + (Format-ExceptionDeep $_)) }
              Write-Host '--- deliberate exception to prove trace fidelity ---'
              try { Get-Item -LiteralPath 'C:\definitely-not-present\missing.bin' -ErrorAction Stop | Out-Null }
              catch { Write-Host (Format-ExceptionDeep $_) }
              try { & ([scriptblock]::Create('throw "nested-exception-canary"')) } catch { Write-Host (Format-ExceptionDeep $_) }
              Write-Host '--- terminating vs non-terminating error semantics ---'
              Write-Host ('ERROR_ACTION_PREFERENCE=' + $ErrorActionPreference)
              Write-Host ('LASTEXITCODE_BEFORE=' + $LASTEXITCODE)
          }

      - name: Scheduled-task context matrix across Interactive, S4U and SYSTEM
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'task_contexts' {
              $ctxScript = Join-Path $env:TELEMETRY_ROOT 'ctx_probe.ps1'
              $ctxLines = @(
                  'param([string]$OutFile)',
                  '$ErrorActionPreference = "Continue"',
                  '$lines = New-Object System.Collections.Generic.List[string]',
                  'function Add-Line([string]$Key, [scriptblock]$Body) {',
                  '    try { $lines.Add($Key + "=" + (& $Body)) }',
                  '    catch { $lines.Add($Key + "=ERROR " + $_.Exception.Message) }',
                  '}',
                  '$lines.Add("WHEN=" + (Get-Date).ToUniversalTime().ToString("o"))',
                  'Add-Line "WHOAMI" { whoami }',
                  'Add-Line "IDENTITY" { [Security.Principal.WindowsIdentity]::GetCurrent().Name }',
                  'Add-Line "IS_SYSTEM" { [Security.Principal.WindowsIdentity]::GetCurrent().IsSystem }',
                  'Add-Line "SESSION_ID" { (Get-Process -Id $PID).SessionId }',
                  'Add-Line "USERPROFILE" { $env:USERPROFILE }',
                  'Add-Line "SESSIONNAME" { $env:SESSIONNAME }',
                  'Add-Line "CWD" { (Get-Location).Path }',
                  'Add-Line "USER_INTERACTIVE" { [System.Environment]::UserInteractive }',
                  'Add-Line "EXPLORER" { ((Get-Process -Name explorer -ErrorAction SilentlyContinue | ForEach-Object { $_.Id.ToString() + "@" + $_.SessionId }) -join ",") }',
                  'Add-Line "EXPLORER_SESSION2_COUNT" { (Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq 2 }).Count }',
                  'Add-Line "TVNSERVER_PRESENT" { Test-Path "C:\\Program Files\\TightVNC\\tvnserver.exe" }',
                  'Add-Line "LISTEN_5900" { [bool](Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue) }',
                  'Add-Line "INTEGRITY" { $g = ((whoami /groups) -join "`n"); if ($g -match "Mandatory Label\\\\([^\\s]+)") { $Matches[1] } else { "UNKNOWN" } }',
                  'Add-Line "PRIV_ENABLED" { $p = ((whoami /priv) -join "`n"); $names = @(); foreach ($line in ($p -split "`n")) { if ($line -match "^\\s*(\\S+Privilege)\\s+.*Enabled") { $names += $Matches[1] } }; if ($names.Count -eq 0) { "NONE" } else { ($names -join ",") } }',
                  'Add-Line "ADMIN_GROUP" { (([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) }',
                  'Add-Line "MODULES_LOADED" { (Get-Process -Id $PID).Modules.Count }',
                  '$lines -join "`r`n" | Set-Content -LiteralPath $OutFile -Encoding utf8'
              )
              [System.IO.File]::WriteAllText($ctxScript, ($ctxLines -join "`r`n") + "`r`n", (New-Object System.Text.UTF8Encoding($false)))
              Write-Host ('CTX_SCRIPT=' + $ctxScript)

              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5) -MultipleInstances IgnoreNew
              $matrix = @(
                  @{ Name = 'TelemetryCtxInteractive'; Logon = 'Interactive' },
                  @{ Name = 'TelemetryCtxS4U'; Logon = 'S4U' },
                  @{ Name = 'TelemetryCtxSystem'; Logon = 'ServiceAccount' }
              )
              foreach ($entry in $matrix) {
                  $outFile = Join-Path $env:TELEMETRY_ROOT ('ctx_' + $entry.Name + '.txt')
                  $action = New-ScheduledTaskAction -Execute 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -Argument ('-NoProfile -ExecutionPolicy Bypass -File "' + $ctxScript + '" -OutFile "' + $outFile + '"')
                  try {
                      Unregister-ScheduledTask -TaskName $entry.Name -Confirm:$false -ErrorAction SilentlyContinue
                      $userId = if ($entry.Logon -eq 'ServiceAccount') { 'SYSTEM' } else { $env:USERNAME }
                      $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType $entry.Logon -RunLevel Highest
                      Register-ScheduledTask -TaskName $entry.Name -Action $action -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
                      Start-ScheduledTask -TaskName $entry.Name -ErrorAction Stop
                      Write-Host ('TASK_STARTED ' + $entry.Name + ' logon=' + $entry.Logon)
                      for ($i = 0; $i -lt 15; $i++) {
                          Start-Sleep -Seconds 2
                          $state = (Get-ScheduledTask -TaskName $entry.Name -ErrorAction SilentlyContinue).State
                          if ($state -ne 'Running') { break }
                      }
                      $info = Get-ScheduledTaskInfo -TaskName $entry.Name -ErrorAction SilentlyContinue
                      Write-Host ('TASK_RESULT {0} state={1} lastResult={2}' -f $entry.Name, (Get-ScheduledTask -TaskName $entry.Name -ErrorAction SilentlyContinue).State, $info.LastTaskResult)
                      if (Test-Path -LiteralPath $outFile) {
                          Write-Host ('TASK_OUTPUT_BEGIN ' + $entry.Name)
                          Get-Content -LiteralPath $outFile | ForEach-Object { Write-Host ('  ' + $_) }
                          Write-Host ('TASK_OUTPUT_END ' + $entry.Name)
                      }
                      else { Write-Host ('TASK_OUTPUT_MISSING ' + $entry.Name) }
                  }
                  catch {
                      Write-Host ('TASK_CONTEXT_ERROR ' + $entry.Name + ' logon=' + $entry.Logon)
                      Write-Host (Format-ExceptionDeep $_)
                  }
                  finally {
                      Unregister-ScheduledTask -TaskName $entry.Name -Confirm:$false -ErrorAction SilentlyContinue
                  }
              }
              Write-Host '--- current console session inventory ---'
              qwinsta
              Get-CimInstance Win32_LogonSession | Where-Object { $_.LogonType -in 2, 3, 10 } | Select-Object LogonId, LogonType, StartTime | Format-Table -AutoSize
          }

      - name: Persistent telemetry heartbeat loop
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath)
          function Get-HeartbeatField {
              param([scriptblock]$Body, [string]$Fallback = 'NA')
              try {
                  $value = & $Body 2>$null
                  if ($null -eq $value) { return $Fallback }
                  return [string]$value
              }
              catch { return $Fallback + ':' + $_.Exception.GetType().Name }
          }
          $minutes = 10
          if ($env:HEARTBEAT_MINUTES) { $parsed = 0; if ([int]::TryParse($env:HEARTBEAT_MINUTES, [ref]$parsed) -and $parsed -gt 0) { $minutes = $parsed } }
          $interval = 30
          if ($env:HEARTBEAT_SECONDS) { $parsedInterval = 0; if ([int]::TryParse($env:HEARTBEAT_SECONDS, [ref]$parsedInterval) -and $parsedInterval -ge 15) { $interval = $parsedInterval } }
          $deadline = (Get-Date).AddMinutes($minutes)
          $heartbeatLog = Join-Path $root 'heartbeat.log'
          Write-Host ('HEARTBEAT_START minutes={0} interval={1}s deadline={2} log={3}' -f $minutes, $interval, $deadline.ToString('o'), $heartbeatLog)
          $tick = 0
          while ((Get-Date) -lt $deadline) {
              $fields = [ordered]@{}
              $fields['timestamp'] = (Get-Date).ToUniversalTime().ToString('o')
              $fields['tick'] = $tick
              $fields['processes'] = Get-HeartbeatField { (Get-Process -ErrorAction SilentlyContinue).Count }
              $fields['sessions'] = Get-HeartbeatField { ((Get-Process -ErrorAction SilentlyContinue | Group-Object SessionId | Sort-Object Name | ForEach-Object { $_.Name + ':' + $_.Count }) -join ',') }
              $fields['cpu_pct'] = Get-HeartbeatField { [math]::Round((Get-CimInstance Win32_Processor -ErrorAction Stop | Measure-Object -Property LoadPercentage -Average).Average, 1) }
              $fields['free_mem_mb'] = Get-HeartbeatField { [int]((Get-CimInstance Win32_OperatingSystem -ErrorAction Stop).FreePhysicalMemory / 1KB) }
              $fields['listeners'] = Get-HeartbeatField { ((Get-ListenerSnapshot -Ports @(5900, 6080, 6081, 3389) | ForEach-Object { $_.Port.ToString() + '=' + $_.State }) -join ',') }
              $fields['scheduled_tasks'] = Get-HeartbeatField { ((Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -like 'Telemetry*' -or $_.TaskName -like 'Desktop*' -or $_.TaskName -like 'Tunnel*' } | ForEach-Object { $_.TaskName + '=' + $_.State }) -join ',') }
              $fields['vnc_binary'] = Get-HeartbeatField { Test-Path -LiteralPath 'C:\Program Files\TightVNC\tvnserver.exe' }
              $fields['cloudflared_binary'] = Get-HeartbeatField { Test-Path -LiteralPath 'C:\ProgramData\cloudflared\cloudflared.exe' }
              $fields['telemetry_files'] = Get-HeartbeatField { (Get-ChildItem -LiteralPath $root -File -ErrorAction SilentlyContinue).Count }
              $line = ($fields.GetEnumerator() | ForEach-Object { $_.Key + '=' + $_.Value }) -join ' '
              Write-Host ('HEARTBEAT ' + $line)
              try { Add-Content -LiteralPath $heartbeatLog -Value $line -Encoding utf8 } catch { Write-Host ('HEARTBEAT_LOG_WRITE_ERROR ' + $_.Exception.Message) }
              $tick++
              Start-Sleep -Seconds $interval
          }
          Write-Host ('HEARTBEAT_END ticks=' + $tick + ' elapsed_s=' + [int]($minutes * 60))

      - name: Aggregate the telemetry bundle and publish diagnostics
        run: |
          $root = if ($env:TELEMETRY_ROOT) { $env:TELEMETRY_ROOT } else { 'C:\telemetry' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $libPath = Join-Path $root 'lib.ps1'
          if (-not (Test-Path -LiteralPath $libPath)) {
              [System.IO.File]::WriteAllText($libPath, [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LIB_B64)), (New-Object System.Text.UTF8Encoding($false)))
          }
          . $libPath
          if (-not (Get-Command Save-Probe -ErrorAction SilentlyContinue)) { throw 'PROBE_LIBRARY_UNAVAILABLE' }
          Write-Host ('LIB_RELOADED=' + $libPath + ' FUNCTIONS=' + ((Get-Command Save-Probe, Invoke-Captured, Show-Captured, Format-ExceptionDeep, Get-ProcessOwnerMap, Get-ListenerSnapshot -ErrorAction SilentlyContinue).Name -join ','))
          Save-Probe 'bundle_manifest' {
              $root = $env:TELEMETRY_ROOT
              $files = Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue
              Write-Host ('BUNDLE_FILE_COUNT=' + $files.Count)
              $manifest = foreach ($file in $files) {
                  [pscustomobject]@{
                      Path = $file.FullName
                      Bytes = $file.Length
                      Sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
                  }
              }
              $manifest | Format-Table -AutoSize
              $manifest | Export-Csv -LiteralPath (Join-Path $root 'manifest.csv') -NoTypeInformation -Encoding utf8
              Write-Host ('BUNDLE_TOTAL_BYTES=' + (($files | Measure-Object -Property Length -Sum).Sum))
              Write-Host '--- heartbeat tail ---'
              Get-Content -LiteralPath (Join-Path $root 'heartbeat.log') -Tail 20 -ErrorAction SilentlyContinue
              Write-Host '--- identity recap ---'
              Write-Host ('WHOAMI=' + (whoami))
              Write-Host ('SESSION=' + (Get-Process -Id $PID).SessionId)
          }
          if ($env:GITHUB_STEP_SUMMARY) {
              @(
                  '# Runner reconnaissance telemetry',
                  '',
                  '- Host: ' + $env:COMPUTERNAME + ' / runner ' + $env:RUNNER_NAME,
                  '- Session: ' + (Get-Process -Id $PID).SessionId + ' / user ' + $env:USERNAME,
                  '- Telemetry root: ' + $env:TELEMETRY_ROOT,
                  '- Sections: ' + ((Get-ChildItem -LiteralPath $env:TELEMETRY_ROOT -Filter '*.log' -ErrorAction SilentlyContinue).BaseName -join ', '),
                  '- Manifest: ' + (Join-Path $env:TELEMETRY_ROOT 'manifest.csv')
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload the telemetry bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-telemetry
          path: C:\telemetry
          if-no-files-found: warn
          retention-days: 7
